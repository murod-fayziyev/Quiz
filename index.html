const TOPICS=[{name:"1-ma’ruza: Kriptografiyaga kirish va tarixiy rivojlanishi",qs:Q1},{name:"2-ma’ruza: Klassik kriptografik usullar",qs:Q2},{name:"3-ma’ruza: Kriptografiyaning matematik asoslari",qs:Q3},{name:"4-ma’ruza: Simmetrik kriptotizimlar va DES",qs:Q4},{name:"5-ma’ruza: AES shifrlash algoritmi",qs:Q5},{name:"6-bo‘lim: AES shifrlash algoritmi — slaydlar bo‘yicha qo‘shimcha savollar",qs:Q6}];
// Keyingi mavzu: TOPICS.push({name:"2-ma’ruza: ...",qs:[ [savol,to‘g‘ri,[3 ta noto‘g‘ri],izoh], ... ]});
const R=20,$=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let pool,deck,pos,queue,N,done,first,wrong,seen,cur,rn;
const chrome=v=>document.querySelectorAll(".bar,.st,#bk").forEach(e=>e.style.display=v?"":"none");
function home(){
  chrome(false);
  const all=TOPICS.flatMap(t=>t.qs);
  $("m").innerHTML='<p class="q">Mavzuni tanlang</p>'+TOPICS.map((t,i)=>'<button class="tp" data-i="'+i+'">'+t.name+'<small>'+t.qs.length+' ta savol · har davrada '+R+' tadan</small></button>').join('')+(TOPICS.length>1?'<button class="tp" data-i="all">🔀 Aralash (hamma mavzular)<small>'+all.length+' ta savol</small></button>':'');
  document.querySelectorAll(".tp").forEach(b=>b.onclick=()=>{const i=b.dataset.i;pool=i==="all"?all:TOPICS[i].qs;deck=[];pos=0;rn=0;round()});
}
function take(n){const o=[];while(o.length<n&&o.length<pool.length){if(pos>=deck.length){deck=sh(pool);pos=0}const x=deck[pos++];if(!o.includes(x))o.push(x)}return o}
function round(){queue=take(R);N=queue.length;done=0;first=0;wrong=0;seen=new Set();rn++;chrome(true);next()}
function next(){
  if(!queue.length)return fin();
  cur=queue.shift();const q=cur,opts=sh([q[1],...q[2]]);
  upd();
  $("m").innerHTML='<p class="q">'+q[0]+'</p>'+opts.map(o=>'<button class="o">'+o+'</button>').join('')+'<div id="fb"></div>';
  document.querySelectorAll(".o").forEach((b,i)=>b.onclick=()=>ans(b,opts[i]===q[1]));
}
function ans(b,ok){
  const q=cur;
  document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent===q[1])x.classList.add("ok")});
  done++;if(ok)first++;else{b.classList.add("no");wrong++}
  seen.add(q);upd();
  $("fb").innerHTML=(ok?'<p style="color:var(--ok);font-weight:600;margin:10px 0 0">✅ To‘g‘ri!</p>':'<p style="color:var(--no);font-weight:600;margin:10px 0 0">❌ Noto‘g‘ri</p>')+(q[3]?'<div class="ex">💡 '+q[3]+'</div>':'')+'<button class="b" id="nx">Keyingisi →</button>';
  $("nx").onclick=next;
}
function upd(){$("pb").style.width=done/N*100+"%";$("s1").textContent="Davra "+rn+" · "+done+" / "+N;$("s2").textContent="Xatolar: "+wrong+" · Qolgan: "+queue.length}
function fin(){
  upd();
  $("m").innerHTML='<div class="big">🎉</div><p class="q t">Davra '+rn+' yakunlandi!</p><p class="t">To‘g‘ri javoblar: <b>'+first+' / '+N+'</b> ('+Math.round(first/N*100)+'%)<br>Xatolar: '+wrong+'</p><button class="b" id="rs">Yana '+R+' ta savol</button><button class="b s" id="hm">Mavzularga qaytish</button>';
  $("rs").onclick=round;$("hm").onclick=home;
}
$("bk").onclick=home;
home();
</script></body></html>
